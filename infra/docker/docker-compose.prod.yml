name: stall-prod

# Full self-hosted production stack: Postgres+PostGIS, Redis, MinIO (S3-
# compatible object storage), Meilisearch, the three app services
# (api/realtime/worker, built from the existing Dockerfiles — the same
# images the GCP Cloud Run path uses), and Caddy as a reverse proxy with
# automatic HTTPS. Runs on a single VPS instead of GCP Cloud Run + Cloud SQL
# + Memorystore; put Cloudflare (proxied DNS + WAF + rate-limiting) in front
# — see infra/terraform/selfhost/.
#
# Usage:
#   cp .env.example .env.prod   # fill in REAL secrets — never commit .env.prod
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file ../../.env.prod up -d --build
#   # first deploy only — reference data + your admin phone, no demo data:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file ../../.env.prod #     run --rm -e SEED_PROFILE=production -e SEED_ADMIN_PHONE=+233XXXXXXXXX migrate pnpm exec prisma db seed
#
# .env.prod supplies everything (JWT keys, SMTP, Nalo SMS, Firebase/FCM,
# Sentry, OTEL, POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD,
# MEILI_MASTER_KEY, DOMAIN, ...) except DATABASE_URL/REDIS_URL/S3_ENDPOINT,
# which are pinned below to the in-network service names — a value for those
# three in .env.prod would point at localhost and never resolve inside Docker.

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-stall}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stall} -d ${POSTGRES_DB:-stall}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO stopped publishing free images (Docker Hub minio/* and quay.io
  # minio/mc are gone); pgsty/* are community builds of the same server/client.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set h http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc ready h"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    # Public read ONLY for listing media (avatars/, vendors/ logos+banners,
    # products/, brand-logos/). KYC documents (kyc/) and invoices (invoices/,
    # sequential names!) stay private — served only through authenticated
    # API/admin routes. See minio-media-policy.json.
    volumes:
      - ./minio-media-policy.json:/policy.tmpl.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-stall-media} &&
      p=$$(cat /policy.tmpl.json) &&
      printf '%s' \"$${p//BUCKET/${S3_BUCKET:-stall-media}}\" > /tmp/policy.json &&
      mc anonymous set-json /tmp/policy.json local/${S3_BUCKET:-stall-media} &&
      echo 'minio bucket ready (listing media public at media.$${DOMAIN}; kyc/ + invoices/ private)'
      "
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env.prod}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data

  # One-shot schema migration before the app services start (reuses the api
  # image, which carries packages/db + the Prisma CLI). `migrate deploy` only
  # applies committed migrations — never resets or drops.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    working_dir: /app/packages/db
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Nightly compressed pg_dump kept 14 days in the `pgbackups` volume (on-box);
  # `backup-offsite` copies each dump off the VPS.
  pgbackup:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      while true; do
        pg_dump -h postgres -U ${POSTGRES_USER:-stall} -d ${POSTGRES_DB:-stall} -Fc -f /backups/stall-$$(date +%Y%m%d-%H%M).dump &&
        echo backup ok;
        find /backups -name 'stall-*.dump' -mtime +14 -delete;
        sleep 86400;
      done
      "
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # Off-box copy of the nightly dumps to any S3-compatible bucket (Cloudflare
  # R2, Backblaze B2, AWS S3). Copy-only (`mc mirror` without --remove), so
  # the remote keeps dumps the box has rotated out — set a lifecycle rule on
  # the bucket for retention. Idles with a warning until BACKUP_S3_* are set.
  backup-offsite:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    environment:
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    entrypoint: >
      /bin/sh -c "
      if [ -z \"$$BACKUP_S3_ENDPOINT\" ] || [ -z \"$$BACKUP_S3_BUCKET\" ]; then
        echo 'WARNING: BACKUP_S3_* not set - database backups are on-box only';
        exec sleep infinity;
      fi;
      mc alias set offsite \"$$BACKUP_S3_ENDPOINT\" \"$$BACKUP_S3_ACCESS_KEY_ID\" \"$$BACKUP_S3_SECRET_ACCESS_KEY\" >/dev/null || exit 1;
      while true; do
        sleep 3600;
        mc mirror --overwrite /backups offsite/$$BACKUP_S3_BUCKET/postgres && echo offsite backup ok || echo 'offsite backup FAILED';
        sleep 82800;
      done
      "
    volumes:
      - pgbackups:/backups:ro
    depends_on:
      - pgbackup

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: [../../.env.prod]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
      DATABASE_POOLING_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      STORAGE_PROVIDER: s3
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    expose: ["3000"]

  realtime:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.realtime
    restart: unless-stopped
    env_file: [../../.env.prod]
    environment:
      NODE_ENV: production
      # realtime authorises room joins against Postgres (@stall/core).
      DATABASE_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
      DATABASE_POOLING_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3001"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file: [../../.env.prod]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
      DATABASE_POOLING_URL: postgresql://${POSTGRES_USER:-stall}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stall}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      STORAGE_PROVIDER: s3
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod, e.g. stall.example}
    depends_on:
      - api
      - realtime
      - minio

volumes:
  pgdata:
  redisdata:
  miniodata:
  meilidata:
  pgbackups:
  caddydata:
  caddyconfig:
