name: stall
description: "Stall — multi-tenant marketplace & delivery engine."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  font_awesome_flutter: ^10.8.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.2
  video_player: ^2.9.2
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # TODO(phase-1): bundle Outfit + Inter .ttf into assets/fonts/ and declare here
  # (design system mandates no runtime font fetch — see docs/03-DESIGN-SYSTEM.md §3).
