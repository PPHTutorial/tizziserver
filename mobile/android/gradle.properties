org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pub cache (C:) and the project (E:) live on different drives, which breaks
# the Kotlin incremental compiler's relative-path cache — it floods the build
# log with IllegalArgumentException stack traces and can leave file handles
# open (the `Unable to delete .../kernel_blob.bin` clean failures). Turning
# incremental Kotlin compilation off avoids that cache entirely.
kotlin.incremental=false
